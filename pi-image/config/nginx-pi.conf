# The Pi box's additions to the viewer's nginx server block. setup.sh builds
# /etc/nginx/sites-available/retro-tv from docker/web/nginx.conf.template
# (the laptop container's config) and includes this file inside the server
# block, so the ErsatzTV proxy rules stay identical in both places.

# The theme service (retro-tv-themed.py). Only the viewer on this box reaches
# it; it is bound to loopback and this server only listens on loopback too.
location = /pi/theme {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:8412;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
# "Power off" on the settings screen (the same service).
location = /pi/power {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8412;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
# How the box is connected (retro-tv-net.sh writes it every minute); the
# viewer's settings screen shows it.
location = /pi/net {
    alias /run/retro-tv/net.json;
    default_type application/json;
    add_header Cache-Control no-store;
}
# Whether the TV is on, from the HDMI-CEC service (retro-tv-cec.py), which
# the viewer polls every few seconds. Without the service (composite, or no
# CEC): 404, and the viewer asks again only now and then. The file is in the
# service's own RuntimeDirectory, gone while it is stopped.
location = /pi/cec {
    alias /run/retro-tv/cec/state.json;
    default_type application/json;
    add_header Cache-Control no-store;
    access_log off;
}
location /pi/ { return 404; }
