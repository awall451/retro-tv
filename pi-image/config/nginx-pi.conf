# The Pi box's additions to the viewer's nginx server block. setup.sh builds
# /etc/nginx/sites-available/retro-tv from docker/web/nginx.conf.template
# (the laptop container's config) and includes this file inside the server
# block, so the ErsatzTV proxy rules stay identical in both places.

# The theme service (retro-tv-themed.py). Only the viewer on this box reaches
# it; it is bound to loopback and this server only listens on loopback too.
location = /pi/theme {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:8412;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
location /pi/ { return 404; }
