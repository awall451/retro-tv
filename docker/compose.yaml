# Retro TV guide viewer. See README.md in this folder.
name: retro-tv

services:
  web:
    # Gantry names the route after the container: retro-tv.<its domains>.
    container_name: retro-tv
    build: ./web
    image: retro-tv-viewer:local
    restart: unless-stopped
    environment:
      ERSATZTV_URL: ${ERSATZTV_URL:?copy .env.example to .env and set ERSATZTV_URL}
    # Published on loopback by default: a proxy on this machine (Gantry) is
    # the way in from other devices, and finds the container by this port.
    # VIEWER_BIND=0.0.0.0 also opens it to the local network.
    ports:
      - "${VIEWER_BIND:-127.0.0.1}:${VIEWER_PORT:-8410}:8080"
    # A network of its own, so the TV Guide generator below can reach it by
    # name (the default bridge has no names).
    networks:
      - retro
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The TV Guide Channel generator: renders tvguide.html from the viewer
  # above and streams it as live HLS for ErsatzTV to carry as a channel.
  # Off by default; start it with:  docker compose --profile tvguide up -d
  # See tvguide/README.md.
  tvguide:
    container_name: retro-tv-tvguide
    profiles: ["tvguide"]
    build: ./tvguide
    image: retro-tv-tvguide:local
    restart: unless-stopped
    depends_on:
      - web
    environment:
      VIEWER_URL: http://web:8080
      TVGUIDE_PROMO: ${TVGUIDE_PROMO:-}
      TVGUIDE_FPS: ${TVGUIDE_FPS:-30}
      TVGUIDE_BITRATE: ${TVGUIDE_BITRATE:-1800k}
    # Where ErsatzTV fetches the stream: http://<this machine>:8412/live.m3u8
    # (TVGUIDE_BIND=0.0.0.0 when ErsatzTV runs elsewhere or in its own container).
    ports:
      - "${TVGUIDE_BIND:-127.0.0.1}:${TVGUIDE_PORT:-8412}:8082"
    networks:
      - retro
    tmpfs:
      - /tmp:size=512m
      - /out:size=256m
    shm_size: 256m
    security_opt:
      - no-new-privileges:true

networks:
  retro:
    name: retro-tv
