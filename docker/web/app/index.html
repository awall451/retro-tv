<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1240">
<meta name="robots" content="noindex">
<title>TV Guide</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/cabin-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="/js/theme-boot.js"></script>
<link rel="stylesheet" href="/css/guide.css">
</head>
<body>

<!-- The guide, drawn in 640x480-style units and scaled to the window. -->
<div id="stage">
  <div id="previewFrame"><span id="previewMsg">Pick a show to watch</span></div>

  <div id="info">
    <div id="infoCh" class="ch"></div>
    <div id="infoTitle" class="title"></div>
    <div id="infoEp" class="ep"></div>
    <div id="infoTime" class="time"></div>
    <div id="infoPlot" class="plot"><span id="infoPlotText"></span></div>
  </div>

  <button id="cog" type="button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g fill="currentColor">
        <rect x="10" y="1" width="4" height="22"/>
        <rect x="10" y="1" width="4" height="22" transform="rotate(45 12 12)"/>
        <rect x="10" y="1" width="4" height="22" transform="rotate(90 12 12)"/>
        <rect x="10" y="1" width="4" height="22" transform="rotate(135 12 12)"/>
        <circle cx="12" cy="12" r="8"/>
      </g>
      <circle class="cogHole" cx="12" cy="12" r="3.5"/>
    </svg>
  </button>

  <div id="grid">
    <div id="clock" class="cell clock"></div>
    <div id="timebar"></div>
    <div id="chans"></div>
    <div id="rows"></div>
    <div id="nowTick"></div>
    <div id="gridMsg">Loading the guide&hellip;</div>
  </div>

  <div id="details" hidden>
    <img id="detPoster" alt="" hidden>
    <div id="detBody">
      <div id="detMeta"></div>
      <div id="detText"></div>
      <div id="detButtons">
        <button id="detWatch" type="button" class="btn sel">Watch now</button>
        <button id="detBack" type="button" class="btn">Back</button>
      </div>
    </div>
  </div>

  <div id="settings" hidden>
    <div id="setTitle">Settings for this device</div>
    <div id="setRows"></div>
    <div id="setHelp"></div>
    <div id="setButtons">
      <button id="setClose" type="button" class="btn">Done</button>
    </div>
  </div>
</div>

<!-- Black behind the picture when it fills the window. -->
<div id="backdrop"></div>

<!-- The one and only player. It is moved between the corner box and the
     full window, never created twice. -->
<div id="screen" hidden>
  <video id="video" playsinline preload="none"></video>
  <div id="tuning" hidden></div>
</div>

<!-- Channel bar, locked to the bottom edge of the full-window picture: over
     it, or just under it when the window has room. A narrow picture (a
     phone held upright) gets the stacked layout, class "narrow". -->
<div id="banner" hidden>
  <div id="banBar"><div id="banFill"></div></div>
  <div class="banInfo">
    <div id="banCh" class="ch"></div>
    <div id="banTitle" class="title"></div>
    <div class="banSub"><span id="banEp"></span><span id="banTime"></span></div>
  </div>
  <span id="banClock"></span>
  <div id="banButtons">
    <button id="banGuide" type="button" class="btn sel">Guide</button>
    <button id="banDown" type="button" class="btn">Ch &minus;</button>
    <button id="banUp" type="button" class="btn">Ch +</button>
    <button id="banMute" type="button" class="btn">Mute</button>
    <button id="banFull" type="button" class="btn">Full screen</button>
  </div>
</div>

<!-- Short messages: typed channel number, sound off. -->
<div id="osd" hidden></div>

<!-- The theme's splash scene, over everything while the guide loads (and
     for a moment after a theme change). Visible from the first paint as a
     plain color; js/splash.js draws the scene into it. -->
<div id="splash"></div>

<script src="/vendor/hls-1.7.3.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
