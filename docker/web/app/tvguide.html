<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Guide Channel</title>
<!-- The listings channel: the late-1990s TV Guide Channel look, drawn from the
     same guide data as the viewer. A channel's live stream plays in the top
     half (&promo=<channel number>); the grid scrolls through every channel
     underneath. Add ?tv for the 640x480 layout and &screen=4:3 on a 720x480
     composite picture (see js/tvguide.js). -->
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/css/tvguide.css">
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="promoBox"><video id="promo" playsinline preload="none"></video></div>
    <div id="card"></div>
  </div>
  <div id="grid">
    <div id="header">
      <div id="clock" class="cell head">--:--:--</div>
      <div id="times"></div>
    </div>
    <div id="viewport">
      <div id="rows"></div>
    </div>
  </div>
</div>
<script src="/vendor/hls-1.7.3.min.js"></script>
<script type="module" src="/js/tvguide.js"></script>
</body>
</html>
