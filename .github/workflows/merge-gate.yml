# Checks a pull request against a fixed list of rules and reports whether it could
# merge without a person. The rules are in .github/merge-gate.json and the checks in
# .github/scripts/review_loop.py. No model is involved: the same input gives the
# same answer.
#
# This is a dry run. It writes its result in one comment on the pull request and as
# the commit status "merge-gate". It does not merge anything.
#
# It runs when CodeRabbit finishes a review, when the owner comments "/gate" on a pull
# request, or by hand from the Actions tab. All three use this file and the scripts as
# they are on the default branch, so a pull request cannot change its own gate.
name: Merge gate

on:
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

jobs:
  merge-gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'check_run' && github.event.check_run.app.slug == 'coderabbitai')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.author_association == 'OWNER'
          && startsWith(github.event.comment.body, '/gate'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_INPUT: ${{ inputs.pr || github.event.issue.number }}
      HEAD_SHA: ${{ github.event.check_run.head_sha }}
    steps:
      - name: Get the scripts from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false

      - name: Check the rules and report
        run: python3 .github/scripts/review_loop.py gate --post
